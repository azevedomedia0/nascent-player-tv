<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nascent Player — Cinema software for living rooms</title>
    <meta name="description" content="Nascent Player — lean-back cinema playback, Stremio catalogs, local libraries, and household peer mesh." />
    <meta property="og:title" content="Nascent Player — Cinema software for living rooms" />
    <meta property="og:description" content="Nascent Player — lean-back cinema playback, Stremio catalogs, local libraries, and household peer mesh." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/nascent-logo.png" />
    <meta property="og:image" content="/nascent-logo.png" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&
          (typeof e.reason === 'string'
            ? e.reason.includes('WebSocket')
            : e.reason.message?.includes('WebSocket') ||
              e.reason.message?.includes('closed without opened') ||
              e.reason.stack?.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation?.();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) ||
          (e.filename && e.filename.includes('@vite/client')) ||
          (e.error && e.error.stack && e.error.stack.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation?.();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
